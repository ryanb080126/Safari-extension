<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Study Buddy</h1>
    <label class="switch" title="Watch this tab">
      <input type="checkbox" id="watch" />
      <span class="slider"></span>
    </label>
  </header>
  <p id="status" class="status">Off for this tab.</p>
  <button id="analyze" class="secondary">Check this page now</button>

  <details id="settings">
    <summary>Settings</summary>
    <label>Anthropic API key
      <input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off" />
    </label>
    <label>Workspace ID (only for personal keys not tied to a workspace)
      <input type="text" id="workspaceId" placeholder="wrkspc_…" autocomplete="off" />
    </label>
    <label>Model
      <select id="model">
        <option value="claude-opus-5-5">Claude Opus 5.5 (most accurate)</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (faster, cheaper)</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 (fastest, cheapest)</option>
      </select>
    </label>
    <label>Effort
      <select id="effort">
        <option value="low">Low (quickest)</option>
        <option value="medium">Medium</option>
        <option value="high">High (most careful)</option>
      </select>
    </label>
    <label class="row"><input type="checkbox" id="useScreenshot" /> Send a screenshot too (helps with images and diagrams)</label>
    <button id="save">Save</button>
    <p id="saved" class="hint"></p>
  </details>

  <p class="hint">Shortcut: Control+Shift+W toggles watching. Your key is stored only in this browser.</p>
  <script src="popup.js"></script>
</body>
</html>
